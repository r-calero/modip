# Apache virtual host for MODIP running behind an existing Apache that holds
# the certificates. Apache terminates TLS and proxies to the MODIP nginx
# container, published on 127.0.0.1:8484 (NGINX_BIND_ADDRESS:NGINX_PROXY_PORT).
#
# Modules: a2enmod ssl proxy proxy_http headers
# Install: copy to /etc/apache2/sites-available/modip.conf, edit ServerName and
# certificate paths, then: a2ensite modip && apachectl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName modip.example.org
    Redirect permanent / https://modip.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName modip.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/modip.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/modip.example.org/privkey.pem

    ProxyRequests Off
    # Keep the public host name, so Rails builds links/redirects with it.
    ProxyPreserveHost On
    # Tell Rails the browser uses HTTPS on 443.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # HTTPS only from now on for browsers (HSTS).
    Header always set Strict-Transport-Security "max-age=31536000"

    # Docking requests can be long; uploads of receptors can be large.
    ProxyTimeout 300
    LimitRequestBody 104857600

    ProxyPass        / http://127.0.0.1:8484/ retry=0 keepalive=On
    ProxyPassReverse / http://127.0.0.1:8484/

    ErrorLog  ${APACHE_LOG_DIR}/modip_error.log
    CustomLog ${APACHE_LOG_DIR}/modip_access.log combined
</VirtualHost>
