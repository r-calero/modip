# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'

development:
  adapter: mysql2
  encoding: utf8
  reconnect: true
  database: censa
  pool: 20
  username: admindemás
  password: c3nsa_adm1ndemás
  socket: /tmp/mysql.sock

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.

test:
  adapter: sqlite
  encoding: utf8
  reconnect: false
  database: db/test.sqlite3
  pool: 20

# In Docker the MODIP_DB_* variables come from .env; without them the
# original values are used.
production:
  adapter: mysql2
  encoding: <%= ENV['MODIP_DB_ENCODING'] || 'utf8' %>
  reconnect: true
  database: <%= ENV['MODIP_DB_NAME'] || 'censa' %>
  pool: <%= ENV['MODIP_DB_POOL'] || 20 %>
  username: <%= ENV['MODIP_DB_USER'] || 'admindemás' %>
  password: <%= ENV['MODIP_DB_PASSWORD'] || 'c3nsa_adm1ndemás' %>
<% if ENV['MODIP_DB_HOST'] %>
  host: <%= ENV['MODIP_DB_HOST'] %>
  port: <%= ENV['MODIP_DB_PORT'] || 3306 %>
<% else %>
  socket: /tmp/mysql.sock
<% end %>
